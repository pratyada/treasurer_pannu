<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A1628"/>

  <!-- Gold accent circles -->
  <circle cx="0" cy="0" r="300" fill="#F59E0B" opacity="0.05"/>
  <circle cx="1200" cy="630" r="350" fill="#F59E0B" opacity="0.05"/>

  <!-- Gold left bar -->
  <rect x="0" y="0" width="8" height="630" fill="#F59E0B"/>

  <!-- Avatar circle -->
  <circle cx="120" cy="200" r="72" fill="#F59E0B" opacity="0.15"/>
  <circle cx="120" cy="200" r="72" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.4"/>
  <text x="120" y="215" font-family="Georgia, serif" font-size="56" fill="#F59E0B" text-anchor="middle" font-weight="bold">P</text>

  <!-- Name -->
  <text x="220" y="185" font-family="Georgia, serif" font-size="52" fill="white" font-weight="bold">Pranav Chudgar, CFA</text>

  <!-- Title -->
  <text x="220" y="230" font-family="-apple-system, Arial, sans-serif" font-size="26" fill="#F59E0B" font-weight="600">Director — Global Treasury · McKinsey &amp; Company</text>

