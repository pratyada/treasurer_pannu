name: Daily Treasury Scraper

on:
  schedule:
    # Run daily at 6:00 AM IST = 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    name: Scrape & Push Treasury Content

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Create output directory
        run: mkdir -p scrapers/output

      - name: Run RBI scraper
        run: python3 scrapers/rbi_scraper.py

      - name: Run SEBI scraper
        run: python3 scrapers/sebi_scraper.py

      - name: Run RSS aggregator
        run: python3 scrapers/rss_aggregator.py

      - name: Push drafts to app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          # Create scrapers/.env from secrets
          echo "APP_URL=$APP_URL" > scrapers/.env
          echo "SCRAPER_API_KEY=$SCRAPER_API_KEY" >> scrapers/.env
          python3 scrapers/push_to_db.py

      - name: Upload scraper output as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-output-${{ github.run_id }}
          path: scrapers/output/
          retention-days: 7
